<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiedy się widzimy?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one narrow column — name picker, month grid, list of days that work for all six */
:root{
  --bg:#eef5f2; --surface:#ffffff; --fg:#1d2b26; --muted:#5f7a70; --line:#d6e6df;
  --accent:#11735a; --accent-fg:#ffffff; --soft:#e0efe9;
  --c-ola:#e2557a; --c-marta:#f08a24; --c-weronika:#2b7bd6; --c-marianna:#9a4fd8;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131c19; --surface:#1c2723; --fg:#eaf4f0; --muted:#9db5ab; --line:#2f4038;
  --accent:#5fd3ad; --accent-fg:#131c19; --soft:#24332d;
  --c-ola:#ff7d9c; --c-marta:#ffa552; --c-weronika:#64a6ff; --c-marianna:#bb86f5;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131c19; --surface:#1c2723; --fg:#eaf4f0; --muted:#9db5ab; --line:#2f4038;
  --accent:#5fd3ad; --accent-fg:#131c19; --soft:#24332d;
  --c-ola:#ff7d9c; --c-marta:#ffa552; --c-weronika:#64a6ff; --c-marianna:#bb86f5;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0}
.lead{margin:6px 0 0;color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px}
.names{display:flex;flex-wrap:wrap;gap:8px}
.name{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px 7px 10px;display:flex;align-items:center;gap:8px;cursor:pointer}
.name .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.name[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.name[aria-pressed="true"] .dot{background:#fff}
.name:focus-visible,.day:focus-visible,.nav:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{margin:10px 0 0;font-size:14px;color:var(--muted)}
.hint b{color:var(--fg)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head h2{text-transform:capitalize}
.nav{font:inherit;font-size:20px;line-height:1;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{font-size:11px;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.day{font:inherit;position:relative;aspect-ratio:1/1.08;max-width:100%;border-radius:12px;border:1.5px solid transparent;background:var(--soft);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 7px;font-variant-numeric:tabular-nums}
.day .n{font-weight:700;font-size:15px}
.day .dots{display:grid;grid-template-columns:repeat(2,6px);gap:2px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.day.mine{border-color:var(--me)}
.day.mine .n{color:var(--me)}
.day.all{background:var(--accent);color:var(--accent-fg)}
.day.all .n{color:var(--accent-fg)}
.day.all .dots i{background:var(--accent-fg)!important;opacity:.9}
.day.past{opacity:.35;cursor:default}
.day.today::after{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--fg)}
.day.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.box{width:16px;height:16px;border-radius:5px;display:inline-block}
.matches{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.match{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.match b{font-family:var(--display);font-size:17px}
.match .sub{font-size:13px;color:var(--muted)}
.match.full{border-color:var(--accent)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent);color:var(--accent-fg);white-space:nowrap}
.badge.near{background:var(--soft);color:var(--fg)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;margin:0}
.status{font-size:13px;color:var(--muted);min-height:1.2em;margin:0}
@media (prefers-reduced-motion:no-preference){.day{transition:background .15s,border-color .15s,transform .1s}.day:active:not(.past){transform:scale(.94)}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Kiedy się widzimy?</h1>
    <p class="lead">Zaznacz dni, w które możesz. Dni na zielono pasują nam wszystkim.</p>
  </header>

  <section>
    <p class="label">Kim jesteś?</p>
    <div class="names" id="names"></div>
    <p class="hint" id="hint">Wybierz swoje imię, a potem stukaj w dni w kalendarzu.</p>
  </section>

  <section class="cal" aria-label="Kalendarz">
    <div class="cal-head">
      <button class="nav" id="prev" aria-label="Poprzedni miesiąc">‹</button>
      <h2 id="month"></h2>
      <button class="nav" id="next" aria-label="Następny miesiąc">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2 style="margin-bottom:10px">Najlepsze terminy</h2>
    <ul class="matches" id="matches"></ul>
  </section>
  <p class="status" id="status"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ===== TUTAJ WKLEJ SWOJĄ KONFIGURACJĘ Z FIREBASE (zamień cały blok) =====
const firebaseConfig = {
  apiKey: "WKLEJ_TUTAJ",
  authDomain: "WKLEJ_TUTAJ",
  databaseURL: "WKLEJ_TUTAJ",
  projectId: "WKLEJ_TUTAJ",
  storageBucket: "WKLEJ_TUTAJ",
  messagingSenderId: "WKLEJ_TUTAJ",
  appId: "WKLEJ_TUTAJ"
};
// =========================================================================

const FRIENDS=[
  {id:"ola",name:"Ola"},{id:"marta",name:"Marta"},{id:"weronika",name:"Weronika"},{id:"marianna",name:"Marianna"}
];
const MONTHS=["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
const MONTHS_GEN=["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
const WD=["pon","wt","śr","czw","pt","sob","nd"];
const WD_LONG=["niedziela","poniedziałek","wtorek","środa","czwartek","piątek","sobota"];

const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=new Date(); today.setHours(0,0,0,0);
const todayKey=key(today);

let me=null; try{me=localStorage.getItem("kiedy-me-grupa2")}catch(e){}
if(!FRIENDS.some(f=>f.id===me)) me=null;
let view=new Date(today.getFullYear(),today.getMonth(),1);
const avail={}; FRIENDS.forEach(f=>avail[f.id]=new Set());
let db=null;

const $=id=>document.getElementById(id);
const setStatus=t=>$("status").textContent=t||"";

function renderNames(){
  const box=$("names"); box.innerHTML="";
  FRIENDS.forEach(f=>{
    const b=document.createElement("button");
    b.className="name"; b.style.setProperty("--c",`var(--c-${f.id})`);
    b.setAttribute("aria-pressed",me===f.id);
    b.innerHTML=`<span class="dot"></span>`; b.append(f.name);
    b.onclick=()=>{me=f.id;try{localStorage.setItem("kiedy-me-grupa2",me)}catch(e){};render()};
    box.append(b);
  });
  const h=$("hint");
  if(me){const n=FRIENDS.find(f=>f.id===me).name;h.innerHTML=`Cześć, <b>${n}</b>! Stuknij dzień, żeby go zaznaczyć lub odznaczyć. Masz zaznaczone: <b>${avail[me].size}</b>.`}
  else h.textContent="Wybierz swoje imię, a potem stukaj w dni w kalendarzu.";
}

const whoOn=k=>FRIENDS.filter(f=>avail[f.id].has(k));

function renderCal(){
  $("month").textContent=MONTHS[view.getMonth()]+" "+view.getFullYear();
  $("prev").disabled=view.getFullYear()===today.getFullYear()&&view.getMonth()===today.getMonth();
  const g=$("grid"); g.innerHTML="";
  WD.forEach(w=>{const d=document.createElement("div");d.className="wd";d.textContent=w;g.append(d)});
  const first=(view.getDay()+6)%7;
  for(let i=0;i<first;i++){const b=document.createElement("div");b.className="day blank";g.append(b)}
  const days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  if(me) g.style.setProperty("--me",`var(--c-${me})`);
  for(let d=1;d<=days;d++){
    const dt=new Date(view.getFullYear(),view.getMonth(),d), k=key(dt);
    const on=whoOn(k), past=dt<today;
    const b=document.createElement("button");
    b.className="day"+(past?" past":"")+(k===todayKey?" today":"")+(on.length===FRIENDS.length?" all":"")+(me&&avail[me].has(k)?" mine":"");
    b.disabled=past;
    b.setAttribute("aria-label",`${d} ${MONTHS_GEN[dt.getMonth()]}: ${on.length} z ${FRIENDS.length}`+(on.length?" ("+on.map(f=>f.name).join(", ")+")":""));
    const dots=FRIENDS.map(f=>`<i style="${avail[f.id].has(k)?`background:var(--c-${f.id})`:""}"></i>`).join("");
    b.innerHTML=`<span class="n">${d}</span><span class="dots">${dots}</span>`;
    b.onclick=()=>toggle(k);
    g.append(b);
  }
  $("legend").innerHTML=FRIENDS.map(f=>`<span><i style="background:var(--c-${f.id})"></i>${f.name}</span>`).join("")+
    `<span><span class="box" style="background:var(--accent)"></span>wszystkie</span>`;
}

function renderMatches(){
  const counts={};
  FRIENDS.forEach(f=>avail[f.id].forEach(k=>{if(k>=todayKey)counts[k]=(counts[k]||0)+1}));
  const ks=Object.keys(counts).sort();
  const full=ks.filter(k=>counts[k]===FRIENDS.length);
  const near=ks.filter(k=>counts[k]===FRIENDS.length-1);
  const ul=$("matches"); ul.innerHTML="";
  const item=(k,isFull)=>{
    const dt=new Date(k+"T00:00:00");
    const li=document.createElement("li"); li.className="match"+(isFull?" full":"");
    const missing=FRIENDS.filter(f=>!avail[f.id].has(k)).map(f=>f.name);
    li.innerHTML=`<div><b>${dt.getDate()} ${MONTHS_GEN[dt.getMonth()]}</b><div class="sub">${WD_LONG[dt.getDay()]}${isFull?"":" · brakuje: "+missing.join(", ")}</div></div><span class="badge${isFull?"":" near"}">${isFull?"wszystkie "+FRIENDS.length:(FRIENDS.length-1)+" z "+FRIENDS.length}</span>`;
    ul.append(li);
  };
  full.forEach(k=>item(k,true));
  near.slice(0,5).forEach(k=>item(k,false));
  if(!full.length&&!near.length){
    const p=document.createElement("li"); p.className="empty";
    p.textContent="Jeszcze nie ma dnia, który pasuje wszystkim. Tu pojawią się terminy, gdy każda zaznaczy swoje dni.";
    ul.append(p);
  }
}

function render(){renderNames();renderCal();renderMatches()}

async function toggle(k){
  if(!me){setStatus("Najpierw wybierz swoje imię u góry.");$("names").scrollIntoView({behavior:"smooth",block:"center"});return}
  if(!db){setStatus("Kalendarz nie jest jeszcze połączony z bazą.");return}
  const id=me, s=avail[id], on=!s.has(k);
  on?s.add(k):s.delete(k); render(); setStatus("Zapisuję…");
  try{
    const r=ref(db,`avail/${id}/${k}`);
    await (on?set(r,true):remove(r));
    setStatus("Zapisano ✓");
  }catch(e){
    on?s.delete(k):s.add(k); render();
    setStatus("Nie udało się zapisać. Sprawdź internet i spróbuj jeszcze raz.");
  }
}

$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};

render();

if(firebaseConfig.apiKey==="WKLEJ_TUTAJ"){
  setStatus("Brakuje konfiguracji Firebase — wklej ją na górze pliku index.html.");
}else{
  try{
    db=getDatabase(initializeApp(firebaseConfig));
    setStatus("Łączę…");
    onValue(ref(db,"avail"),snap=>{
      const v=snap.val()||{};
      FRIENDS.forEach(f=>avail[f.id]=new Set(Object.keys(v[f.id]||{})));
      render(); if($("status").textContent==="Łączę…") setStatus("");
    },()=>setStatus("Nie mogę odczytać kalendarza. Sprawdź reguły bazy w Firebase."));
  }catch(e){setStatus("Konfiguracja Firebase jest niepoprawna. Sprawdź, czy wkleiłaś cały blok.")}
}
</script>
</body>
</html>
